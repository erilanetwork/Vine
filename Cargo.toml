[workspace]
members = ["crates/*"]
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0"

[workspace.dependencies]
vine-protocol = { path = "crates/vine-protocol" }
vine-i18n = { path = "crates/vine-i18n" }
vine-security = { path = "crates/vine-security" }
vine-network = { path = "crates/vine-network" }
vine-config = { path = "crates/vine-config" }
vine-auth = { path = "crates/vine-auth" }
vine-plugin = { path = "crates/vine-plugin" }

pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e077274271538b2b7601e0665ab4173d158eb71b" }
pumpkin-auth = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e077274271538b2b7601e0665ab4173d158eb71b" }
pumpkin-command = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e077274271538b2b7601e0665ab4173d158eb71b" }
pumpkin-plugin-runtime = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "e077274271538b2b7601e0665ab4173d158eb71b" }
wasmtime = { git = "https://github.com/bytecodealliance/wasmtime", rev = "f6b3140dbb1d9b436ef523d14740292c956b0364", default-features = false, features = ["runtime", "component-model", "component-model-async", "async", "cache", "cranelift", "gc", "gc-drc", "threads", "std"] }
wasmtime-wasi = { git = "https://github.com/bytecodealliance/wasmtime", rev = "f6b3140dbb1d9b436ef523d14740292c956b0364", default-features = false, features = ["p2", "p3"] }

tokio = { version = "1.53", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
toml = { version = "1.1", features = ["parse", "display", "serde"] }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "chrono"] }
rustyline = { version = "19.0", default-features = false }
thiserror = { version = "2.0" }
bytes = { version = "1.12" }
uuid = { version = "1.26", features = ["serde", "v3", "v4"] }
rand = { version = "0.10" }
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# Networking & Sockets
socket2 = { version = "0.6", features = ["all"] }

# Security & Cryptography
aes = { version = "0.9", default-features = false }
cfb8 = { version = "0.9", default-features = false }
rsa = { version = "=0.10.0-rc.18", features = ["std", "encoding"] }
sha1 = { version = "=0.11.0" }
sha2 = { version = "=0.11.0" }
num-bigint = { version = "0.5" }
base64 = { version = "0.23" }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
hex = { version = "0.4", default-features = false, features = ["std"] }

# HTTP client for Mojang auth
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "json", "http2"] }

tempfile = "3"

[package]
name = "vine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
vine-protocol.workspace = true
vine-i18n.workspace = true
vine-security.workspace = true
vine-network.workspace = true
vine-config.workspace = true
vine-auth.workspace = true
vine-plugin.workspace = true
pumpkin-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustyline.workspace = true
thiserror.workspace = true
bytes.workspace = true
uuid.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true

[profile.release]
lto = true
codegen-units = 1
